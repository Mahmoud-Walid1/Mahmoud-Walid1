<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="botChassis" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e2438" />
      <stop offset="50%" stop-color="#121624" />
      <stop offset="100%" stop-color="#0b0e1a" />
    </linearGradient>

    <linearGradient id="visorGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <linearGradient id="neonPurple" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="cyanGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes floatBot {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-14px) rotate(1.2deg); }
      }
      @keyframes pulseVisor {
        0%, 100% { opacity: 0.95; filter: drop-shadow(0 0 8px #00f2fe); }
        50% { opacity: 0.75; filter: drop-shadow(0 0 16px #38bdf8); }
      }
      @keyframes scanlineMove {
        0% { transform: translateY(-30px); opacity: 0; }
        50% { opacity: 0.6; }
        100% { transform: translateY(30px); opacity: 0; }
      }
      @keyframes blinkEye {
        0%, 94%, 98%, 100% { transform: scaleY(1); }
        96% { transform: scaleY(0.1); }
      }
      @keyframes shadowPulse {
        0%, 100% { transform: scale(1); opacity: 0.35; }
        50% { transform: scale(0.85); opacity: 0.18; }
      }
      .bot-group {
        animation: floatBot 4s ease-in-out infinite;
        transform-origin: center;
      }
      .visor-glow {
        animation: pulseVisor 3s ease-in-out infinite;
      }
      .scanline {
        animation: scanlineMove 2.5s linear infinite;
      }
      .eye-blink {
        animation: blinkEye 4.5s infinite;
        transform-origin: 200px 185px;
      }
      .floor-shadow {
        animation: shadowPulse 4s ease-in-out infinite;
        transform-origin: 200px 360px;
      }
    </style>
  </defs>

  <!-- Ambient Floor Glow Shadow -->
  <ellipse class="floor-shadow" cx="200" cy="360" rx="100" ry="16" fill="#00f2fe" filter="url(#cyanGlow)" />
  <ellipse class="floor-shadow" cx="200" cy="360" rx="60" ry="9" fill="#8b5cf6" filter="url(#softGlow)" />

  <!-- Animated Robot Group -->
  <g class="bot-group">
    <!-- Floating Cyber Jet Thruster Effect -->
    <path d="M185,295 Q200,340 215,295 Z" fill="url(#visorGrad)" filter="url(#cyanGlow)" opacity="0.8" />
    <polygon points="192,295 200,325 208,295" fill="#ffffff" />

    <!-- Chassis Body -->
    <rect x="150" y="235" width="100" height="65" rx="24" fill="url(#botChassis)" stroke="#8b5cf6" stroke-width="2.5" />
    <!-- Chest Core Reactor -->
    <circle cx="200" cy="265" r="14" fill="#0d111d" stroke="#00f2fe" stroke-width="2" />
    <circle cx="200" cy="265" r="7" fill="url(#visorGrad)" filter="url(#cyanGlow)" />
    <!-- Chest Tech Lines -->
    <line x1="165" y1="255" x2="178" y2="255" stroke="#475569" stroke-width="2" stroke-linecap="round" />
    <line x1="165" y1="265" x2="175" y2="265" stroke="#475569" stroke-width="2" stroke-linecap="round" />
    <line x1="222" y1="255" x2="235" y2="255" stroke="#475569" stroke-width="2" stroke-linecap="round" />
    <line x1="225" y1="265" x2="235" y2="265" stroke="#475569" stroke-width="2" stroke-linecap="round" />

    <!-- Left Floating Arm / Hand -->
    <g transform="translate(-10, 0)">
      <rect x="118" y="240" width="22" height="42" rx="11" fill="url(#botChassis)" stroke="#00f2fe" stroke-width="1.8" />
      <circle cx="129" cy="250" r="3" fill="#00f2fe" />
    </g>

    <!-- Right Floating Arm / Hand (Waving Pose) -->
    <g transform="translate(10, -8) rotate(-12 260 250)">
      <rect x="260" y="235" width="22" height="42" rx="11" fill="url(#botChassis)" stroke="#00f2fe" stroke-width="1.8" />
      <circle cx="271" cy="245" r="3" fill="#00f2fe" />
    </g>

    <!-- Neck Connector -->
    <rect x="186" y="222" width="28" height="15" rx="5" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <line x1="192" y1="225" x2="208" y2="225" stroke="#00f2fe" stroke-width="1.5" />

    <!-- Head Chassis -->
    <rect x="125" y="115" width="150" height="110" rx="36" fill="url(#botChassis)" stroke="url(#visorGrad)" stroke-width="3" />

    <!-- Ear Plates / Audio Pods -->
    <rect x="112" y="145" width="15" height="50" rx="7" fill="#121624" stroke="#8b5cf6" stroke-width="2" />
    <circle cx="119" cy="170" r="4" fill="#00f2fe" filter="url(#softGlow)" />
    <rect x="273" y="145" width="15" height="50" rx="7" fill="#121624" stroke="#8b5cf6" stroke-width="2" />
    <circle cx="280" cy="170" r="4" fill="#00f2fe" filter="url(#softGlow)" />

    <!-- Head Top Antenna & Node -->
    <line x1="200" y1="115" x2="200" y2="78" stroke="#8b5cf6" stroke-width="3.5" stroke-linecap="round" />
    <circle cx="200" cy="74" r="10" fill="#090d16" stroke="#00f2fe" stroke-width="2.5" />
    <circle cx="200" cy="74" r="5" fill="url(#visorGrad)" filter="url(#cyanGlow)" />

    <!-- Visor Glass (Curved OLED Screen) -->
    <rect x="142" y="140" width="116" height="65" rx="20" fill="#060810" stroke="#1e293b" stroke-width="2" />

    <!-- Visor Eye Display (Glowing Cyber Eyes) -->
    <g class="eye-blink visor-glow">
      <!-- Left Eye -->
      <rect x="158" y="158" width="26" height="24" rx="8" fill="url(#visorGrad)" filter="url(#cyanGlow)" />
      <circle cx="168" cy="166" r="3" fill="#ffffff" />
      <!-- Right Eye -->
      <rect x="216" y="158" width="26" height="24" rx="8" fill="url(#visorGrad)" filter="url(#cyanGlow)" />
      <circle cx="226" cy="166" r="3" fill="#ffffff" />
      <!-- Smiling Cyber Mouth Wave -->
      <path d="M188,193 Q200,199 212,193" fill="none" stroke="#00f2fe" stroke-width="2.5" stroke-linecap="round" filter="url(#softGlow)" />
    </g>

    <!-- High-Tech Visor Scanline FX -->
    <g opacity="0.25">
      <line class="scanline" x1="145" y1="172" x2="255" y2="172" stroke="#00f2fe" stroke-width="1.5" />
    </g>
  </g>
</svg>
