<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="cyber-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Hexagon -->
  <polygon points="32,4 58,18 58,46 32,60 6,46 6,18" fill="#090d16" stroke="url(#cyber-grad)" stroke-width="2.5" />

  <!-- Inner Cyber Nodes -->
  <polygon points="32,12 50,22 50,42 32,52 14,42 14,22" fill="#121829" stroke="#8b5cf6" stroke-width="1.5" opacity="0.6" />

  <!-- Central Energy Core -->
  <circle cx="32" cy="32" r="8" fill="url(#cyber-grad)" filter="url(#neon-glow)" />
  <circle cx="32" cy="32" r="3.5" fill="#ffffff" />
</svg>
